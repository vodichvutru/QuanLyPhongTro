services:
  db:
    image: mysql:8.0
    container_name: quanlyphongtro-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: quanlyphongtro
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quanlyphongtro-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=db;Port=3306;Database=quanlyphongtro;User=root;Password=${MYSQL_ROOT_PASSWORD:-123456};"
      Jwt__Secret: ${JWT_SECRET:-QuanLyPhongTro_Secret_Key_Do_Not_Share_0123456789!}
      Jwt__Issuer: "QuanLyPhongTro"
      Jwt__Audience: "QuanLyPhongTroClient"
      Jwt__AccessTokenExpiryMinutes: "1440"
      Jwt__RefreshTokenExpiryDays: "7"
      Seed__Reset: ${SEED_RESET:-false}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
